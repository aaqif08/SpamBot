# Local development stack: SQLite + thread jobs + local storage. For production use docker-compose.prod.yml.
services:
  backend:
    build: ./backend
    container_name: botshield-backend
    env_file:
      - .env
    environment:
      BOTSHIELD_ENVIRONMENT: "development"
      BOTSHIELD_CORS_ORIGINS: "http://localhost:8080,http://localhost:5173"
      BOTSHIELD_DATABASE_URL: "sqlite:////app/data/botshield.db"
      BOTSHIELD_STORAGE_BACKEND: "local"
      BOTSHIELD_STORAGE_LOCAL_ROOT: "/app/data/storage"
      BOTSHIELD_JOB_BACKEND: "thread"
    volumes:
      - backend-data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: botshield-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  backend-data:
