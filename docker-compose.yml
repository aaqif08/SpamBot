services:
  backend:
    build: ./backend
    container_name: botshield-backend
    env_file:
      - .env
    environment:
      BOTSHIELD_ENVIRONMENT: "development"
      BOTSHIELD_CORS_ORIGINS: "http://localhost:8080,http://localhost:5173"
      BOTSHIELD_DATABASE_URL: "sqlite:////app/data/botshield.db"
      BOTSHIELD_DATA_DIR: "/app/data"
      BOTSHIELD_MODELS_DIR: "/app/models"
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: botshield-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
