services:
  - type: web
    name: botshield-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    branch: main
    envVars:
      - key: BOTSHIELD_ENVIRONMENT
        value: development
      - key: BOTSHIELD_CORS_ORIGINS
        value: "*"
      - key: BOTSHIELD_DATABASE_URL
        value: sqlite:////app/data/botshield.db

  - type: web
    name: botshield-frontend
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false


