# Render Blueprint — BotShield AI (free tier)
#
# Deploy: Render dashboard → New → Blueprint → select this repo → Apply.
# After the first deploy:
#   1. Open the backend service → Shell:  python -m app.cli create-admin
#      (or set BOTSHIELD_ADMIN_EMAIL / BOTSHIELD_ADMIN_PASSWORD / BOTSHIELD_ADMIN_ORG before the first boot;
#       the entrypoint creates the admin once and never overwrites an existing user).
#   2. IMPORTANT: Render hostnames are global. If "botshield-backend.onrender.com" was already
#      taken by another account, your backend gets a suffixed hostname and the /api/* rewrite
#      below would proxy (including login credentials) to a stranger's site. Copy the backend URL
#      shown in the dashboard into the rewrite destination below, push, and let the Blueprint sync.
#      Verify with: curl https://<frontend-host>/api/v1/health  ->  {"status":"ok","version":...}
#
# Free-tier limits that matter (see docs/deployment.md):
#   - No persistent disk: with BOTSHIELD_STORAGE_BACKEND=local, uploaded datasets and trained model
#     artefacts are lost on every deploy/restart. Set the S3 variables (any S3-compatible bucket,
#     e.g. Cloudflare R2 / Backblaze B2 free tiers) and BOTSHIELD_STORAGE_BACKEND=s3 for durability.
#   - Single web instance, no Redis/worker: BOTSHIELD_JOB_BACKEND=thread runs training/batch jobs
#     inside the API process. 512 MB RAM: train with hyperparameter_search=false or small
#     search_iterations on large datasets.
#   - Free Postgres expires after 90 days unless upgraded; free web services sleep when idle.

# Database: Render allows ONE free Postgres per account. Either delete your old free database so the
# Blueprint can create "botshield-db" (uncomment the block below), or paste the Internal Database URL of
# an existing database into BOTSHIELD_DATABASE_URL when the Blueprint asks for it (default below).
#
# databases:
#   - name: botshield-db
#     plan: free
#     databaseName: botshield
#     user: botshield

services:
  - type: web
    name: botshield-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    branch: main
    healthCheckPath: /api/v1/health
    envVars:
      - key: BOTSHIELD_ENVIRONMENT
        value: production
      - key: BOTSHIELD_DATABASE_URL
        sync: false   # PostgreSQL URL. Neon: use the DIRECT string (host without '-pooler') because of BOTSHIELD_DB_SCHEMA
      - key: BOTSHIELD_DB_SCHEMA
        value: botshield   # own schema, so a database shared with another app cannot clash
      - key: BOTSHIELD_SECRET_KEY
        generateValue: true
      - key: BOTSHIELD_CORS_ORIGINS
        value: https://botshield-frontend.onrender.com
      - key: BOTSHIELD_TRUSTED_PROXIES
        value: "*"
      - key: BOTSHIELD_COOKIE_SECURE
        value: "true"
      - key: BOTSHIELD_COOKIE_SAMESITE
        value: strict
      - key: BOTSHIELD_JOB_BACKEND
        value: thread
      - key: BOTSHIELD_STORAGE_BACKEND
        value: local
      - key: BOTSHIELD_STORAGE_LOCAL_ROOT
        value: /app/data/storage
      - key: BOTSHIELD_LOG_JSON
        value: "true"
      - key: BOTSHIELD_DOCS_ENABLED
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      # Durable storage (recommended): fill these in the dashboard and switch STORAGE_BACKEND to s3
      - key: BOTSHIELD_S3_BUCKET
        sync: false
      - key: BOTSHIELD_S3_ENDPOINT_URL
        sync: false
      - key: BOTSHIELD_S3_REGION
        sync: false
      - key: BOTSHIELD_S3_ACCESS_KEY_ID
        sync: false
      - key: BOTSHIELD_S3_SECRET_ACCESS_KEY
        sync: false
      # First administrator (consumed once at boot; remove after the first login)
      - key: BOTSHIELD_ADMIN_EMAIL
        sync: false
      - key: BOTSHIELD_ADMIN_PASSWORD
        sync: false
      - key: BOTSHIELD_ADMIN_ORG
        sync: false
      # Optional X (Twitter) API v2 bearer token
      - key: BOTSHIELD_X_BEARER_TOKEN
        sync: false

  - type: web
    name: botshield-frontend
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Same-origin API: /api/* is proxied to the backend by the rewrite below, so the refresh
      # cookie stays first-party. Leave empty unless you serve the API from a custom domain.
      - key: VITE_API_BASE_URL
        value: ""
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /api/*
        destination: https://botshield-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
